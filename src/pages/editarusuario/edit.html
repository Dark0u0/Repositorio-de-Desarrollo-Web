<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Editar Usuario</title>
    <link rel="stylesheet" href="./edit.css">
</head>
<body>
    <div class="card">
        <div class="card-body">
            <h1 class="card-title">Editar Usuario</h1>

            <div id="edit-form-container">
                <form>
                    <div class="mb-3">
                        <label for="nameInput" class="form-label">Nombre:</label>
                        <input type="text" class="form-control" id="nameInput" placeholder="Nombre del usuario">
                    </div>
                    <div class="mb-3">
                        <label for="emailInput" class="form-label">Correo:</label>
                        <input type="email" class="form-control" id="emailInput" placeholder="Correo del usuario">
                    </div>
                    <div class="d-flex gap-2">
                        <button type="button" class="btn btn-primary" id="guardarBtn">Guardar</button>
                        <button type="button" class="btn btn-secondary" id="cancelarBtn">Cancelar</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</body>
</html>
